name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    name: Build, deploy & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and start the app (Docker)
        working-directory: .
        run: docker compose up --build --detach --wait

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install test dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Fast, critical-path checks act as the deployment gate: if these fail,
      # the full regression run never starts.
      - name: Smoke tests (deployment gate)
        run: npx playwright test --grep "@smoke"
        env:
          BASE_URL: http://localhost:3000

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: e2e/playwright-report
          retention-days: 14

      - name: Full regression suite
        run: npx playwright test --grep-invert "@smoke"
        env:
          BASE_URL: http://localhost:3000

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-regression
          path: e2e/playwright-report
          retention-days: 14

      - name: Show app logs on failure
        if: failure()
        working-directory: .
        run: docker compose logs app
